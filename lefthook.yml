glob_matcher: doublestar

commit-msg:
  jobs:
    - name: validate
      run: yarn commitlint --edit {1}

pre-commit:
  jobs:
    - name: format
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,json5,css,scss,less,graphql,gql,toml}"
      run: yarn oxfmt --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "packages/**/*.{js,jsx,ts,tsx}"
      # oxlint has no rules for declaration files and fails the job outright when
      # every file it is handed is one of them.
      exclude: '\.d\.ts$'
      run: yarn oxlint --report-unused-disable-directives {staged_files}
    - name: lint-jss
      glob: "packages/**/src/**/*.styles.js"
      run: yarn stylelint {staged_files}
