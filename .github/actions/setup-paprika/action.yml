name: "Setup Paprika"
description: "Install Node.js, enable Yarn and install workspace dependencies. Requires actions/checkout to have already run."

inputs:
  with-cypress-cache:
    description: "Whether to cache Cypress binary"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: "yarn"

    - name: Setup Yarn
      shell: bash
      run: corepack enable

    - name: Cache Cypress
      if: inputs.with-cypress-cache == 'true'
      uses: actions/cache@v6
      id: cypress-cache
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-cypress-

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile
